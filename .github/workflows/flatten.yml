name: Flatten repo root
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  flatten:
    if: "!contains(github.event.head_commit.message, 'root-flatten-marker')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move qisr contents to root
        run: |
          if [ -d qisr ]; then
            cp -a qisr/. .
            rm -rf qisr
          fi
          rm -f .github/workflows/flatten.yml
      - name: Commit flattened tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "root-flatten-marker" || echo "nothing to commit"
          git push
